# Baut Lockara fuer Windows - auf einem Windows-Server bei GitHub, ohne
# eigenen Windows-Rechner.
#
# Ablauf: Pakete installieren, Modelle holen (aus dem Cache, wenn
# vorhanden), mit bauen/windows/Lockara.spec bauen, die fertige
# Lockara.exe ihren Selbsttest machen lassen und alles als ZIP ablegen.
#
# Ergebnis: auf GitHub unter "Actions" -> "Windows-Bau" -> der jeweilige
# Lauf -> "Artifacts" -> Lockara-Windows.zip zum Herunterladen.
#
# Laeuft bei jedem Hochladen auf den Zweig windows-bau, bei jedem
# Versions-Tag (v1.2.3) und von Hand ("Run workflow" auf GitHub).

name: Windows-Bau

on:
  push:
    branches: [windows-bau]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-bau-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    name: Lockara fuer Windows bauen
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      # Dieselben Modelle und derselbe Cache-Schluessel wie in tests.yml.
      - name: Modelle aus dem Cache
        uses: actions/cache@v4
        with:
          path: ressourcen/modell
          key: modelle-windows-${{ hashFiles('werkzeuge/modell_holen.py', 'lockara/kern/modell.py', 'lockara/kern/nachsortierung.py') }}

      - name: Modelle holen (falls nicht im Cache)
        run: python -m werkzeuge.modell_holen

      - name: Bauen
        run: python -m PyInstaller bauen\windows\Lockara.spec --noconfirm

      # Lockara.exe hat kein Konsolenfenster. Die Ausgabe des Selbsttests
      # geht deshalb in eine Datei (siehe selbsttest() in lockara/start.py).
      - name: Selbsttest der fertigen Lockara.exe
        run: |
          $env:LOCKARA_SELBSTTEST_LOG = "$PWD\selbsttest.txt"
          $p = Start-Process -FilePath dist\Lockara\Lockara.exe -ArgumentList "--selbsttest" -Wait -PassThru
          if (Test-Path selbsttest.txt) { Get-Content selbsttest.txt } else { Write-Host "Keine Ausgabe - die exe ist vor dem Selbsttest abgebrochen." }
          exit $p.ExitCode

      - name: ZIP packen
        run: |
          $version = (Select-String -Path lockara\version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist\Lockara -DestinationPath "Lockara-$version-Windows.zip"
          Get-Item "Lockara-$version-Windows.zip" | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB)}}

      - name: ZIP zum Herunterladen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Lockara-Windows
          path: Lockara-*-Windows.zip
          retention-days: 30

      # Laeuft auch, wenn ein Schritt davor gescheitert ist - dann zeigt
      # die Protokolldatei von PyInstaller, welches Modul gefehlt hat.
      - name: Bauprotokoll ablegen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bauprotokoll
          path: |
            build\Lockara\warn-Lockara.txt
            selbsttest.txt
          if-no-files-found: ignore
